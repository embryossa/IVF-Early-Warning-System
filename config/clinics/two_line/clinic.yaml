# config/clinics/two_line/clinic.yaml — профиль лаборатории.
#
# Здесь живёт всё, что относится к КОНКРЕТНОЙ лаборатории: имя, опорное окно, набор
# карт, объявленные объяснения сдвигов. Метод (математика карт, целевые частоты,
# правила чекпойнтов) — в config/settings.yaml и одинаков для всех клиник.
#
# Новая лаборатория = копия config/clinics/_template/ + заполнить эти два файла.
# Пошагово — docs/RUNBOOK.md.

code: "two_line"
name: "Two-Line IVF"
timezone: "Asia/Tashkent"

teable:
  base_name: "EWS — OPU master (Two-Line IVF)"

# --- Опорное окно (in-control) ---------------------------------------------
# Период, объявленный владельцем эталонным. Задаёт ЦЕНТР относительного контура.
# Абсолютный контур Венского консенсуса он не заменяет и не сдвигает.
reference_window:
  start: "2026-05-01"
  end: null                   # null = по текущий день
  declared_by: "owner"
  declared_at: "2026-08-13"
  note: >
    Решение владельца: с мая 2026 все параметры считаются эталонными и нормой для
    лаборатории. Оговорки фиксируются в incontrol_parameters.json как baseline_caveats
    и переносятся в манифест калибровки — чтобы «в контроле» никогда не читалось как
    «в порядке» там, где сдвиг уже произошёл и был принят за норму.

  # Сдвиги внутри окна, которым владелец дал объяснение. Объяснение НЕ отменяет
  # оговорку — оно её дополняет, и оба текста живут в манифесте рядом.
  declared_shifts:
    OCCR:
      explanation: >
        Врачи стали точнее считать фолликулы на пункции. Это изменение ЗНАМЕНАТЕЛЯ,
        а не результата: подтверждено данными — фолликулов на цикл 16.7 -> 18.6
        (+12%), при этом ОКК на цикл 13.3 -> 13.4 (+1%, p=0.84) и MII на цикл
        10.1 -> 10.3. Само получение ооцитов не менялось.
      declared_by: "owner"
      declared_at: "2026-08-13"
      confirmed_by_data: true

# --- Карты этой лаборатории ------------------------------------------------
# По одной на контур. Число карт входит в подбор порогов: каждая лишняя ужесточает
# h всем остальным (docs/METHODOLOGY.md §5.4-5.5). При ~70 эмбрионах в месяц три —
# практический максимум.
charts:
  cusum: ["FR", "BlR", "MIIR"]

  # Метрики, исключённые из карт по ПРИРОДЕ знаменателя, а не по объёму.
  # Проверяется при добавлении карты: имя отсюда в cusum попасть не может.
  subjective_denominator:
    OCCR: >
      Знаменатель — число фолликулов, субъективный счёт врача на пункции. Дрейфует
      вместе с практикой счёта и имитирует сдвиг процесса: май 2026 дал -7.6 пп по
      OCCR при неизменном ОКК на цикл. Метрика остаётся в абсолютном контуре, но
      секвенциальной карты не получает: карта на ней ловила бы изменения в том, как
      считают, а не в том, как работают.

# --- Импутация недостающих признаков ---------------------------------------
# Решение владельца (2026-08-13): AMH в мастер-таблице заполняется редко (0 из 37
# циклов опорного окна). Пока принимается КОНСТАНТОЙ 2.0, если в OPU table нет
# иного значения.
#
# Следствие, которое надо знать: формула зрелости литературного приора
# (logit = 2.4665 + 0.005*age - 0.782*stim + 0.24*AMH - 0.069) при константном AMH
# вырождается почти в константу — размах по всему диапазону возраста 25-45 лет
# составляет 0.008 (0.902 -> 0.911). Приор MIIR остаётся годной ОПОРОЙ УРОВНЯ
# (~0.90 против наших 0.772), но индивидуальной дискриминации не даёт и риск-
# коррекцией служить не может по построению. Проверка corr это ловит сама.
imputation:
  amh_constant: 2.0
  # Решение владельца (2026-08-13): пустой «№ попытки» означает ПЕРВУЮ попытку.
  # В выгрузке он заполнен в 6 строках из 77 — заполняют его, только когда попытка
  # не первая. Это доменное знание, а не догадка по данным, поэтому подстановка
  # безопасна; без неё модель теряла бы 71 цикл из 77 на пустом признаке.
  attempt_default: 1
  amh_source_note: >
    константа владельца, не оценка по пациентке; при появлении реальных значений
    AMH в выгрузке они используются, а константа применяется только к пропускам

# --- Источники этой лаборатории --------------------------------------------
sources:
  # Гейты; конкретные пути и id — в config/machine.local.yaml.
  miri: true                  # недельная выгрузка логов инкубатора
  lots: true                  # Airtable, лоты среды по реальным датам использования
  pgt: false
