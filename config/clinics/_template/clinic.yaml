# config/clinics/<code>/clinic.yaml — ШАБЛОН профиля новой лаборатории.
#
# Скопируйте каталог целиком: cp -r config/clinics/_template config/clinics/<code>
# Пошаговая инструкция запуска на новой лаборатории — docs/RUNBOOK.md.
#
# Здесь только то, что различается между лабораториями. Метод (математика карт,
# целевые частоты ложных тревог, правила чекпойнтов) — в config/settings.yaml,
# он одинаков везде и при заведении новой клиники НЕ правится.

code: ""                      # короткий код, совпадает с именем каталога
name: ""                      # человекочитаемое имя
timezone: "Asia/Tashkent"

teable:
  base_name: ""               # имя базы OPU-мастера; пусто -> сгенерируется из name

# --- Опорное окно (in-control) ---------------------------------------------
# ОБЯЗАТЕЛЬНО. Период, который владелец лаборатории объявляет эталонным. Задаёт
# ЦЕНТР относительного контура; абсолютный контур Венского консенсуса не заменяет.
#
# Как выбирать: период без известных инцидентов, достаточно длинный, чтобы набрать
# хотя бы несколько сотен наблюдений на метрику. Слишком короткое окно даст широкую
# неопределённость центра, и бэкфит поднимет пороги (это честно, но детекция
# замедлится). Слишком длинное рискует вобрать в норму реальный сдвиг — бэкфит
# такие случаи находит и печатает как baseline_caveats, но решение остаётся за
# владельцем.
reference_window:
  start: ""                   # YYYY-MM-DD
  end: null                   # null = по текущий день
  declared_by: "owner"
  declared_at: ""
  note: ""

  # Сдвиги внутри окна, которым владелец дал объяснение. Объяснение НЕ отменяет
  # оговорку — оба текста живут в манифесте рядом. Заполняется ПОСЛЕ первого
  # прогона ews_baseline.py, когда видно, какие сдвиги окно вобрало.
  declared_shifts: {}
  #  OCCR:
  #    explanation: "..."
  #    declared_by: "owner"
  #    declared_at: "YYYY-MM-DD"
  #    confirmed_by_data: true

# --- Карты этой лаборатории ------------------------------------------------
# По одной на контур (врач / эмбриолог / культивирование). Число карт входит в
# подбор порогов: каждая лишняя ужесточает h всем остальным, потому что цель по
# ложным тревогам совместная (docs/METHODOLOGY.md §5.4-5.5). Ориентир: при ~70
# эмбрионах в месяц три карты — практический максимум; при большем объёме можно
# добавлять, но проверьте задержку детекции в отчёте бэкфита.
charts:
  cusum: ["FR", "BlR", "MIIR"]

  # Метрики, исключённые из карт по ПРИРОДЕ знаменателя, а не по объёму.
  # OCCR исключён по умолчанию и обоснованно: его знаменатель — субъективный счёт
  # фолликулов врачом, он дрейфует вместе с практикой счёта и имитирует сдвиг
  # процесса. Убирайте отсюда, только если точно знаете, что делаете.
  subjective_denominator:
    OCCR: >
      Знаменатель — число фолликулов, субъективный счёт врача на пункции. Дрейфует
      вместе с практикой счёта и имитирует сдвиг процесса. Метрика остаётся в
      абсолютном контуре, но секвенциальной карты не получает.

# --- Импутация недостающих признаков ---------------------------------------
# AMH нужен формуле зрелости литературного приора. Если в выгрузке он заполняется
# редко, задайте константу — но помните следствие: при константном AMH приор MIIR
# вырождается в фиксированный уровень (~0.90) и перестаёт различать пациенток.
# Как опора уровня он остаётся годен, как риск-коррекция — нет.
# Пусто -> приор MIIR не считается вовсе, и это честнее выдуманного числа.
imputation:
  amh_constant: null
  amh_source_note: ""
  # Чем считать пустой «№ попытки». Во многих выгрузках его заполняют, только
  # когда попытка не первая — тогда 1. Проверьте это у своей лаборатории: если
  # пропуск означает «неизвестно», оставьте null.
  attempt_default: null

# --- Источники этой лаборатории --------------------------------------------
# Гейты; конкретные пути, id и токены — в config/machine.local.yaml и
# config/settings.local.yaml, никогда здесь.
sources:
  miri: false                 # недельная выгрузка логов инкубатора
  lots: false                 # Airtable, лоты среды по датам использования
  pgt: false
